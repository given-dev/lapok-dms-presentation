<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — Outpost DMS</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/inter.css?v=20260801">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0B1220 0%,#111F36 55%,#1E293B 100%);padding:1rem;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility;position:relative;overflow:hidden}
body::before{content:'';position:fixed;top:-150px;left:-150px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(229,62,62,.26),transparent 70%);pointer-events:none;filter:blur(44px)}
body::after{content:'';position:fixed;bottom:-170px;right:-170px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.2),transparent 70%);pointer-events:none;filter:blur(46px)}
.card{position:relative;background:#fff;border-radius:18px;padding:2.1rem;width:100%;max-width:400px;box-shadow:0 24px 70px rgba(2,6,23,.55);animation:card-in .4s ease both;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#E53E3E 30%,#FF6B6B 70%,transparent)}
@keyframes card-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;margin:0 auto 1rem;display:block;object-fit:contain;border-radius:14px;background:#fff;box-shadow:0 10px 24px rgba(229,62,62,.3)}
h1{font-size:1.35rem;margin-bottom:.25rem;color:#0F172A;text-align:center}
h1::after{content:'';display:block;width:36px;height:3px;border-radius:2px;background:linear-gradient(90deg,#E53E3E,#FF6B6B);margin:.55rem auto 0}
.sub{font-size:.85rem;color:#64748B;margin:.5rem 0 1.6rem;text-align:center}
label{display:block;font-size:.8rem;font-weight:700;margin-bottom:.35rem;color:#334155}
input{width:100%;padding:.78rem .85rem;border:1.5px solid #E2E8F0;border-radius:10px;font-size:.95rem;margin-bottom:1rem;transition:border-color .2s ease,box-shadow .2s ease;font-family:inherit;background:#fff;color:#0F172A;min-height:46px;box-shadow:inset 0 1px 2px rgba(15,23,42,.03)}
input:hover{border-color:#94A3B8}
input:focus{outline:none;border-color:#E53E3E;box-shadow:0 0 0 4px #FEE2E2,inset 0 1px 2px rgba(15,23,42,.03)}
button{width:100%;padding:.85rem;border:none;border-radius:10px;background:linear-gradient(135deg,#E53E3E,#DC2626);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;font-family:inherit;transition:transform .15s ease,box-shadow .2s ease,background .2s ease;box-shadow:0 6px 16px rgba(229,62,62,.28);min-height:48px}
button:hover:not(:disabled){background:linear-gradient(135deg,#DC2626,#B91C1C);transform:translateY(-2px);box-shadow:0 10px 24px rgba(229,62,62,.38)}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:focus-visible,input:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}
button:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
.err{background:#FEE2E2;color:#991B1B;padding:.65rem .85rem;border-radius:10px;font-size:.85rem;margin-bottom:1rem;display:none;animation:shake .3s ease;border:1px solid #FCA5A5;border-left:4px solid #E53E3E;box-shadow:0 4px 12px rgba(229,62,62,.08)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hint{margin-top:1.25rem;font-size:.75rem;color:#94A3B8;line-height:1.5}
.hint code{background:#F1F5F9;padding:2px 6px;border-radius:4px;font-size:.7rem}

.grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.9) 20%,transparent 72%);mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.9) 20%,transparent 72%)}
.card{box-shadow:0 24px 70px rgba(2,6,23,.55),0 0 60px rgba(229,62,62,.1)}
.logo{animation:rise .5s ease .05s both,pulse 3.6s ease-in-out .9s infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 24px rgba(229,62,62,.3)}50%{box-shadow:0 12px 30px rgba(229,62,62,.45)}}
h1{animation:rise .5s ease .12s both}
.sub{animation:rise .5s ease .18s both}
#loginForm{animation:rise .5s ease .26s both}
.hint{animation:rise .5s ease .34s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pw{position:relative}
.pw .pw-eye{position:absolute;right:8px;top:28px;width:32px;height:32px;padding:0;margin:0;min-height:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:8px;color:#94A3B8;box-shadow:none;cursor:pointer}
.pw .pw-eye:hover{background:#F1F5F9;color:#475569;transform:none}
.pw .pw-eye:active{transform:none}
.pw-caps{display:none;align-items:center;gap:5px;margin:-0.5rem 0 .8rem;font-size:.72rem;font-weight:600;color:#B45309}
.pw-caps.on{display:flex}
.spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.btn-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #fff inset;-webkit-text-fill-color:#0F172A;border-color:#E2E8F0}
.hint{border-top:1px solid #EEF2F7;padding-top:1rem}
.foot{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:.5rem;font-size:.7rem;color:#94A3B8;letter-spacing:.03em;animation:rise .5s ease .4s both}
.foot::before{content:'';width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#E53E3E,#FF6B6B);box-shadow:0 0 6px rgba(229,62,62,.5)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="card">
  <img class="logo" src="assets/img/outpost-dms-logo.png" alt="Outpost DMS" width="64" height="64">
  <h1>Outpost DMS</h1>
  <p class="sub">Depot Management System — stock, fleet &amp; daily close</p>
  <div class="err" id="err"></div>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="username" placeholder="name@company.com">
    <div class="pw">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
      <button type="button" class="pw-eye" id="pwToggle" aria-label="Show password" aria-pressed="false">
        <svg class="pw-icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="pw-icon-slash" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
      <div class="pw-caps" id="capsWarn">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Caps Lock is on
      </div>
    </div>
    <button type="submit" id="btn">Sign in</button>
  </form>
  <p class="hint">Sign in with the account assigned by your administrator. Change the initial password before operational use.</p>
  <div class="foot">Outpost DMS · <span id="footYear"></span></div>
</div>
<script src="assets/presentation-config.js?v=20260719a"></script>
<script src="assets/api.js?v=20260804e"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  if (params.get('role') === 'disabled') {
    const err = document.getElementById('err');
    err.textContent = 'This role is disabled for now. Use cadet@lapok.ug for field access.';
    err.style.display = 'block';
  }
  try {
    const me = await LapokAPI.get('/api/auth/me.php');
    if (me.user) location.href = 'index.html';
  } catch (_) {}
})();

document.getElementById('footYear').textContent = new Date().getFullYear();

const pwInput = document.getElementById('password');
const pwToggle = document.getElementById('pwToggle');
pwToggle.addEventListener('click', () => {
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  pwToggle.setAttribute('aria-pressed', String(show));
  pwToggle.querySelector('.pw-icon-eye').style.display = show ? 'none' : 'inline';
  pwToggle.querySelector('.pw-icon-slash').style.display = show ? 'inline' : 'none';
  pwInput.focus();
});

const capsWarn = document.getElementById('capsWarn');
pwInput.addEventListener('keyup', (e) => {
  capsWarn.classList.toggle('on', !!e.getModifierState && e.getModifierState('CapsLock'));
});

function setBtnLoading(loading) {
  const btn = document.getElementById('btn');
  btn.classList.toggle('btn-loading', loading);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span>Signing in…' : 'Sign in';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  setBtnLoading(true);
  try {
    const data = await LapokAPI.post('/api/auth/login.php', {
      email: document.getElementById('email').value.trim(),
      password: pwInput.value,
    });
    const role = data?.user?.role;
    const allowed = window.LAPOK_ALLOWED_ROLES || [];
    const disabled = window.LAPOK_DISABLED_ROLES || [];
    if (disabled.includes(role) || (allowed.length && !allowed.includes(role))) {
      try { await LapokAPI.post('/api/auth/logout.php', {}); } catch (_) {}
      err.textContent = 'This role is disabled for now. Use cadet@lapok.ug for field access.';
      err.style.display = 'block';
      setBtnLoading(false);
      return;
    }
    location.href = 'index.html';
  } catch (ex) {
    err.textContent = ex.message || 'Login failed';
    err.style.display = 'block';
    setBtnLoading(false);
  }
});
</script>
</body>
</html>
